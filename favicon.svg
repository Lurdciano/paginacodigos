<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Code bracket: < / > -->
  <g filter="url(#glow)">
    <!-- Left chevron < -->
    <path d="M 22 21 L 13 32 L 22 43" fill="none" stroke="#38bdf8" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Slash / -->
    <line x1="35.5" y1="19" x2="28.5" y2="45" stroke="#f8fafc" stroke-width="4.8" stroke-linecap="round"/>

    <!-- Right chevron > -->
    <path d="M 42 21 L 51 32 L 42 43" fill="none" stroke="#38bdf8" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
